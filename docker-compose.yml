services:
  postgres:
    image: postgres:17-alpine
    container_name: vidtrans-postgres
    environment:
      POSTGRES_DB: "${VIDTRANS_POSTGRES_DB:-vidtrans}"
      POSTGRES_USER: "${VIDTRANS_POSTGRES_USER:-vidtrans}"
      POSTGRES_PASSWORD: "${VIDTRANS_POSTGRES_PASSWORD:-vidtrans}"
    ports:
      # Keep loopback-only by default. Set VIDTRANS_POSTGRES_BIND_ADDRESS=0.0.0.0
      # only when a VPS/network firewall restricts port 5432 to trusted clients.
      - "${VIDTRANS_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${VIDTRANS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDTRANS_POSTGRES_USER:-vidtrans} -d ${VIDTRANS_POSTGRES_DB:-vidtrans}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    image: vidtrans-web
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vidtrans-web
    depends_on:
      vidtrans:
        condition: service_started
    ports:
      # Local entry point: static web client, API paths proxied to the vidtrans container.
      - "127.0.0.1:5200:80"
    environment:
      VIDTRANS_PUBLIC_BASE_URL: "${VIDTRANS_PUBLIC_BASE_URL:-}"
      VIDTRANS_API_UPSTREAM: "http://vidtrans:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/web-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  social-browser:
    image: vidtrans-social-browser
    build:
      context: ./deploy/douyin-browser
      dockerfile: Dockerfile
    container_name: vidtrans-social-browser
    ports:
      # noVNC is loopback-only. Production traffic enters through authenticated Nginx.
      - "127.0.0.1:5201:6080"
    expose:
      - "9222"
    environment:
      DISPLAY: ":99"
      SCREEN_GEOMETRY: "1024x720x24"
      CHROMIUM_PROFILE_DIR: "/data/profile"
      BROWSER_START_URL: "https://www.douyin.com/"
      BROWSER_LANGUAGE: "vi-VN"
      CDP_EXTERNAL_HOST: "social-browser"
      TZ: "Asia/Ho_Chi_Minh"
      # One proxy is required because all source-login sites share this browser.
      BROWSER_PROXY_SERVER: "${VIDTRANS_SOCIAL_BROWSER_PROXY:-}"
    volumes:
      # Keep the legacy volume name so an existing Douyin login survives migration.
      - douyin-browser-profile:/data/profile
    shm_size: "1gb"
    restart: unless-stopped

  tiktok-browser:
    image: vidtrans-douyin-browser
    build:
      context: ./deploy/douyin-browser
      dockerfile: Dockerfile
    container_name: vidtrans-tiktok-browser
    ports:
      - "127.0.0.1:5202:6080"
    expose:
      - "9222"
    environment:
      DISPLAY: ":99"
      SCREEN_GEOMETRY: "1024x720x24"
      CHROMIUM_PROFILE_DIR: "/data/profile"
      BROWSER_START_URL: "https://www.tiktok.com/tiktokstudio/upload"
      BROWSER_LANGUAGE: "vi-VN"
      CDP_EXTERNAL_HOST: "tiktok-browser"
      TZ: "Asia/Ho_Chi_Minh"
      # Optional: route Chromium through a proxy to bypass TikTok IP blocks.
      # Formats: socks5://user:pass@host:port | http://host:port | socks4://host:port
      BROWSER_PROXY_SERVER: "${VIDTRANS_TIKTOK_PROXY:-}"
    volumes:
      - tiktok-browser-profile:/data/profile
      - ./backend/outputs:/app/backend/outputs:ro
    shm_size: "1gb"
    restart: unless-stopped

  vidtrans:
    image: vidtrans-vidtrans
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidtrans
    extra_hosts:
      # Lets the container reach Ollama on the host (needed on Linux; built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      social-browser:
        condition: service_healthy
      tiktok-browser:
        condition: service_healthy
    ports:
      # API only (no web pages). Loopback-only: browsers use the web container on 5200;
      # this port is for API clients in development, e.g. the Flutter app on a simulator.
      - "127.0.0.1:${VIDTRANS_API_PORT:-5210}:8000"
    environment:
      # Build the internal DSN from the same credentials used to initialize
      # PostgreSQL, preventing a stale VIDTRANS_DATABASE_URL password.
      VIDTRANS_POSTGRES_HOST: postgres
      VIDTRANS_POSTGRES_DB: "${VIDTRANS_POSTGRES_DB:-vidtrans}"
      VIDTRANS_POSTGRES_USER: "${VIDTRANS_POSTGRES_USER:-vidtrans}"
      VIDTRANS_POSTGRES_PASSWORD: "${VIDTRANS_POSTGRES_PASSWORD:-vidtrans}"
      VIDTRANS_POSTGRES_INTERNAL_PORT: "5432"
      VIDTRANS_RECOVER_INTERRUPTED_JOBS: "1"
      VIDTRANS_OCR_BACKEND: "${VIDTRANS_OCR_BACKEND:-auto}"
      VIDTRANS_OCR_MODEL: "${VIDTRANS_OCR_MODEL:-medium}"
      VIDTRANS_WORKER_CONCURRENCY: "${VIDTRANS_WORKER_CONCURRENCY:-auto}"
      # Terminal job videos are deleted after 30 days by default; set 0 to opt out.
      VIDTRANS_RETENTION_ENABLED: "${VIDTRANS_RETENTION_ENABLED:-1}"
      VIDTRANS_JOB_RETENTION_DAYS: "${VIDTRANS_JOB_RETENTION_DAYS:-30}"
      VIDTRANS_RETENTION_INTERVAL_MINUTES: "${VIDTRANS_RETENTION_INTERVAL_MINUTES:-60}"
      VIDTRANS_AUDIT_RETENTION_DAYS: "${VIDTRANS_AUDIT_RETENTION_DAYS:-365}"
      VIDTRANS_RELEASED_QUOTA_RETENTION_DAYS: "${VIDTRANS_RELEASED_QUOTA_RETENTION_DAYS:-90}"
      VIDTRANS_TRANSLATION_PROXY: "${VIDTRANS_TRANSLATION_PROXY:-}"
      # Translation/TTS credentials are read only by the backend container.
      # Compose env files provide interpolation values but do not automatically
      # inject undeclared variables into a service environment.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Truyện → Video: model chia cảnh (mặc định theo GEMINI_TRANSLATION_MODEL) và model vẽ ảnh.
      VIDTRANS_COMIC_LLM_MODEL: "${VIDTRANS_COMIC_LLM_MODEL:-}"
      VIDTRANS_COMIC_IMAGE_MODEL: "${VIDTRANS_COMIC_IMAGE_MODEL:-gemini-2.5-flash-image}"
      VIDTRANS_COMFYUI_URL: "${VIDTRANS_COMFYUI_URL:-}"
      VIDTRANS_COMFYUI_CHECKPOINT: "${VIDTRANS_COMFYUI_CHECKPOINT:-}"
      VIDTRANS_COMFYUI_STEPS: "${VIDTRANS_COMFYUI_STEPS:-20}"
      VIDTRANS_COMFYUI_CFG: "${VIDTRANS_COMFYUI_CFG:-7}"
      VIDTRANS_COMFYUI_SAMPLER: "${VIDTRANS_COMFYUI_SAMPLER:-euler}"
      VIDTRANS_COMFYUI_SCHEDULER: "${VIDTRANS_COMFYUI_SCHEDULER:-normal}"
      VIDTRANS_COMFYUI_MAX_SIDE: "${VIDTRANS_COMFYUI_MAX_SIDE:-1024}"
      VIDTRANS_COMIC_CONCURRENCY: "${VIDTRANS_COMIC_CONCURRENCY:-3}"
      # Hoạt hình AI: Veo (dùng GEMINI_API_KEY) hoặc GPU worker riêng (docs/animation-worker-api.md).
      VIDTRANS_ANIMATION_CONCURRENCY: "${VIDTRANS_ANIMATION_CONCURRENCY:-1}"
      VIDTRANS_VEO_MODEL: "${VIDTRANS_VEO_MODEL:-veo-3.0-fast-generate-001}"
      VIDTRANS_VEO_DURATIONS: "${VIDTRANS_VEO_DURATIONS:-4,6,8}"
      VIDTRANS_ANIMATION_WORKER_URL: "${VIDTRANS_ANIMATION_WORKER_URL:-}"
      VIDTRANS_ANIMATION_WORKER_TOKEN: "${VIDTRANS_ANIMATION_WORKER_TOKEN:-}"
      VIDTRANS_ANIMATION_WORKER_MODEL: "${VIDTRANS_ANIMATION_WORKER_MODEL:-gpu-worker}"
      VIDTRANS_ANIMATION_WORKER_MAX_SECONDS: "${VIDTRANS_ANIMATION_WORKER_MAX_SECONDS:-8}"
      GEMINI_TRANSLATION_MODEL: "${GEMINI_TRANSLATION_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_TRANSLATION_MODELS: "${GEMINI_TRANSLATION_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.6-flash,gemini-2.5-flash-lite,gemini-2.5-flash}"
      # Local translators via Ollama on the host: `ollama pull qwen3:4b` / `ollama pull translategemma`.
      VIDTRANS_OLLAMA_URL: "${VIDTRANS_OLLAMA_URL:-http://host.docker.internal:11434}"
      VIDTRANS_TRANSLATEGEMMA_MODEL: "${VIDTRANS_TRANSLATEGEMMA_MODEL:-translategemma}"
      VIDTRANS_QWEN3_MODEL: "${VIDTRANS_QWEN3_MODEL:-qwen3:4b}"
      VIDTRANS_QWEN3_BATCH_LINES: "${VIDTRANS_QWEN3_BATCH_LINES:-12}"
      VIDTRANS_ELEVENLABS_API_KEY: "${VIDTRANS_ELEVENLABS_API_KEY:-}"
      VIDTRANS_ELEVENLABS_VOICES: "${VIDTRANS_ELEVENLABS_VOICES:-}"
      VIDTRANS_ELEVENLABS_FEMALE_VOICE_ID: "${VIDTRANS_ELEVENLABS_FEMALE_VOICE_ID:-}"
      VIDTRANS_ELEVENLABS_MALE_VOICE_ID: "${VIDTRANS_ELEVENLABS_MALE_VOICE_ID:-}"
      VIDTRANS_ELEVENLABS_FEMALE_VOICE_LABEL: "${VIDTRANS_ELEVENLABS_FEMALE_VOICE_LABEL:-Nữ — ElevenLabs}"
      VIDTRANS_ELEVENLABS_MALE_VOICE_LABEL: "${VIDTRANS_ELEVENLABS_MALE_VOICE_LABEL:-Nam — ElevenLabs}"
      VIDTRANS_ELEVENLABS_MODEL_ID: "${VIDTRANS_ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}"
      VIDTRANS_CIT_VOICE_URL: "${VIDTRANS_CIT_VOICE_URL:-}"
      VIDTRANS_CIT_VOICE_API_KEY: "${VIDTRANS_CIT_VOICE_API_KEY:-}"
      VIDTRANS_CIT_VOICE_FEMALE: "${VIDTRANS_CIT_VOICE_FEMALE:-}"
      VIDTRANS_CIT_VOICE_MALE: "${VIDTRANS_CIT_VOICE_MALE:-}"
      VIDTRANS_CIT_VOICE_CONCURRENCY: "${VIDTRANS_CIT_VOICE_CONCURRENCY:-1}"
      VIDTRANS_AZURE_SPEECH_KEY: "${VIDTRANS_AZURE_SPEECH_KEY:-}"
      VIDTRANS_AZURE_SPEECH_REGION: "${VIDTRANS_AZURE_SPEECH_REGION:-southeastasia}"
      VIDTRANS_WHISPER_CONCURRENCY: "1"
      VIDTRANS_ASR_ENGINE: "${VIDTRANS_ASR_ENGINE:-faster}"
      VIDTRANS_ASR_COMPUTE_TYPE: "${VIDTRANS_ASR_COMPUTE_TYPE:-int8}"
      VIDTRANS_ASR_BEAM_SIZE: "${VIDTRANS_ASR_BEAM_SIZE:-5}"
      VIDTRANS_ASR_VAD: "${VIDTRANS_ASR_VAD:-1}"
      VIDTRANS_ASR_CPU_THREADS: "${VIDTRANS_ASR_CPU_THREADS:-0}"
      VIDTRANS_OCR_CONCURRENCY: "1"
      VIDTRANS_TIKTOK_BROWSER_CDP_URL: "http://tiktok-browser:9222"
      VIDTRANS_TIKTOK_BROWSER_PUBLIC_URL: "${VIDTRANS_TIKTOK_BROWSER_PUBLIC_URL:-http://localhost:5202/vnc_lite.html?autoconnect=true&resize=scale&reconnect=true&path=websockify}"
      VIDTRANS_TIKTOK_CLIENT_KEY: "${VIDTRANS_TIKTOK_CLIENT_KEY:-}"
      VIDTRANS_TIKTOK_CLIENT_SECRET: "${VIDTRANS_TIKTOK_CLIENT_SECRET:-}"
      VIDTRANS_TIKTOK_REDIRECT_URI: "${VIDTRANS_TIKTOK_REDIRECT_URI:-}"
      VIDTRANS_TIKTOK_SCOPES: "${VIDTRANS_TIKTOK_SCOPES:-video.upload}"
      VIDTRANS_INSTAGRAM_CLIENT_ID: "${VIDTRANS_INSTAGRAM_CLIENT_ID:-}"
      VIDTRANS_INSTAGRAM_CLIENT_SECRET: "${VIDTRANS_INSTAGRAM_CLIENT_SECRET:-}"
      VIDTRANS_INSTAGRAM_REDIRECT_URI: "${VIDTRANS_INSTAGRAM_REDIRECT_URI:-}"
      VIDTRANS_INSTAGRAM_SCOPES: "${VIDTRANS_INSTAGRAM_SCOPES:-instagram_business_basic,instagram_business_content_publish}"
      VIDTRANS_INSTAGRAM_API_VERSION: "${VIDTRANS_INSTAGRAM_API_VERSION:-v24.0}"
      VIDTRANS_FACEBOOK_CLIENT_ID: "${VIDTRANS_FACEBOOK_CLIENT_ID:-}"
      VIDTRANS_FACEBOOK_CLIENT_SECRET: "${VIDTRANS_FACEBOOK_CLIENT_SECRET:-}"
      VIDTRANS_FACEBOOK_REDIRECT_URI: "${VIDTRANS_FACEBOOK_REDIRECT_URI:-}"
      VIDTRANS_FACEBOOK_API_BASE: "${VIDTRANS_FACEBOOK_API_BASE:-https://graph.facebook.com/v24.0}"
      VIDTRANS_YOUTUBE_CLIENT_ID: "${VIDTRANS_YOUTUBE_CLIENT_ID:-}"
      VIDTRANS_YOUTUBE_CLIENT_SECRET: "${VIDTRANS_YOUTUBE_CLIENT_SECRET:-}"
      VIDTRANS_YOUTUBE_REDIRECT_URI: "${VIDTRANS_YOUTUBE_REDIRECT_URI:-}"
      VIDTRANS_PUBLIC_BASE_URL: "${VIDTRANS_PUBLIC_BASE_URL:-}"
      # Mobile deep links the OAuth callbacks may return to, e.g. vidtrans://oauth (docs/mobile-api.md).
      VIDTRANS_APP_REDIRECT_URIS: "${VIDTRANS_APP_REDIRECT_URIS:-}"
      VIDTRANS_MEDIA_SIGNING_SECRET: "${VIDTRANS_MEDIA_SIGNING_SECRET:-}"
      VIDTRANS_THREADS_CLIENT_ID: "${VIDTRANS_THREADS_CLIENT_ID:-}"
      VIDTRANS_THREADS_CLIENT_SECRET: "${VIDTRANS_THREADS_CLIENT_SECRET:-}"
      VIDTRANS_THREADS_REDIRECT_URI: "${VIDTRANS_THREADS_REDIRECT_URI:-}"
      VIDTRANS_THREADS_SCOPES: "${VIDTRANS_THREADS_SCOPES:-threads_basic,threads_content_publish}"
      VIDTRANS_PINTEREST_ACCESS_TOKEN: "${VIDTRANS_PINTEREST_ACCESS_TOKEN:-}"
      VIDTRANS_PINTEREST_BOARD_ID: "${VIDTRANS_PINTEREST_BOARD_ID:-}"
      VIDTRANS_LINKEDIN_ACCESS_TOKEN: "${VIDTRANS_LINKEDIN_ACCESS_TOKEN:-}"
      VIDTRANS_LINKEDIN_OWNER_URN: "${VIDTRANS_LINKEDIN_OWNER_URN:-}"
      VIDTRANS_LINKEDIN_API_VERSION: "${VIDTRANS_LINKEDIN_API_VERSION:-202609}"
      VIDTRANS_CREDENTIAL_ENCRYPTION_KEY: "${VIDTRANS_CREDENTIAL_ENCRYPTION_KEY:-}"
      VIDTRANS_CREDENTIAL_ENCRYPTION_KEY_ID: "${VIDTRANS_CREDENTIAL_ENCRYPTION_KEY_ID:-primary}"
      VIDTRANS_AUTH_ENABLED: "${VIDTRANS_AUTH_ENABLED:-0}"
      VIDTRANS_AUTH_USERNAME: "${VIDTRANS_AUTH_USERNAME:-}"
      VIDTRANS_AUTH_PASSWORD_HASH: "${VIDTRANS_AUTH_PASSWORD_HASH:-}"
      VIDTRANS_JWT_SECRET: "${VIDTRANS_JWT_SECRET:-}"
      VIDTRANS_JWT_ISSUER: "${VIDTRANS_JWT_ISSUER:-vidtrans}"
      VIDTRANS_JWT_AUDIENCE: "${VIDTRANS_JWT_AUDIENCE:-vidtrans-api}"
      VIDTRANS_JWT_TTL_MINUTES: "${VIDTRANS_JWT_TTL_MINUTES:-30}"
      VIDTRANS_REFRESH_TOKEN_TTL_DAYS: "${VIDTRANS_REFRESH_TOKEN_TTL_DAYS:-5}"
      VIDTRANS_AUTH_COOKIE_NAME: "${VIDTRANS_AUTH_COOKIE_NAME:-vidtrans_access_token}"
      VIDTRANS_AUTH_REFRESH_COOKIE_NAME: "${VIDTRANS_AUTH_REFRESH_COOKIE_NAME:-vidtrans_refresh_token}"
      VIDTRANS_AUTH_COOKIE_SECURE: "${VIDTRANS_AUTH_COOKIE_SECURE:-0}"
      # SMTP for password-reset codes; the feature stays off until HOST and FROM are set.
      VIDTRANS_SMTP_HOST: "${VIDTRANS_SMTP_HOST:-}"
      VIDTRANS_SMTP_PORT: "${VIDTRANS_SMTP_PORT:-}"
      VIDTRANS_SMTP_SECURITY: "${VIDTRANS_SMTP_SECURITY:-starttls}"
      VIDTRANS_SMTP_USERNAME: "${VIDTRANS_SMTP_USERNAME:-}"
      VIDTRANS_SMTP_PASSWORD: "${VIDTRANS_SMTP_PASSWORD:-}"
      VIDTRANS_SMTP_FROM: "${VIDTRANS_SMTP_FROM:-}"
      VIDTRANS_SMTP_FROM_NAME: "${VIDTRANS_SMTP_FROM_NAME:-VidTrans}"
      VIDTRANS_TRUST_PROXY_HEADERS: "${VIDTRANS_TRUST_PROXY_HEADERS:-0}"
      VIDTRANS_YTDLP_COOKIE_FILE: "${VIDTRANS_YTDLP_COOKIE_FILE:-}"
      # Default yt-dlp to the same egress as the interactive Chromium session.
      # A platform-specific value may still override the shared proxy.
      VIDTRANS_YOUTUBE_PROXY: "${VIDTRANS_YOUTUBE_PROXY:-${VIDTRANS_SOCIAL_BROWSER_PROXY:-}}"
      VIDTRANS_N8N_WEBHOOK_URL: "${VIDTRANS_N8N_WEBHOOK_URL:-}"
      VIDTRANS_N8N_WEBHOOK_SECRET: "${VIDTRANS_N8N_WEBHOOK_SECRET:-}"
      VIDTRANS_N8N_TIMEOUT_SECONDS: "${VIDTRANS_N8N_TIMEOUT_SECONDS:-5}"
      VIDTRANS_N8N_MAX_ATTEMPTS: "${VIDTRANS_N8N_MAX_ATTEMPTS:-8}"
      VIDTRANS_N8N_ALLOW_INSECURE_HTTP: "${VIDTRANS_N8N_ALLOW_INSECURE_HTTP:-0}"
      VIDTRANS_DOUYIN_BROWSER_CDP_URL: "http://social-browser:9222"
      VIDTRANS_DOUYIN_BROWSER_PUBLIC_URL: "${VIDTRANS_SOURCE_BROWSER_PUBLIC_URL:-http://localhost:5201/vnc_lite.html?autoconnect=true&resize=scale&reconnect=true&path=websockify}"
      VIDTRANS_YOUTUBE_BROWSER_CDP_URL: "http://social-browser:9222"
      VIDTRANS_YOUTUBE_BROWSER_PUBLIC_URL: "${VIDTRANS_SOURCE_BROWSER_PUBLIC_URL:-http://localhost:5201/vnc_lite.html?autoconnect=true&resize=scale&reconnect=true&path=websockify}"
      VIDTRANS_FACEBOOK_BROWSER_CDP_URL: "http://social-browser:9222"
      VIDTRANS_FACEBOOK_BROWSER_PUBLIC_URL: "${VIDTRANS_SOURCE_BROWSER_PUBLIC_URL:-http://localhost:5201/vnc_lite.html?autoconnect=true&resize=scale&reconnect=true&path=websockify}"
    volumes:
      - ./backend/outputs:/app/backend/outputs
      - ./backend/uploads:/app/backend/uploads
      - ./backend/work:/app/backend/work
      # Store exported Netscape cookies under ./secrets and configure the path in .env.
      - ./secrets:/app/secrets:ro
      - whisper-models:/root/.cache/whisper
      # faster-whisper models are downloaded from Hugging Face on first use.
      - whisper-hf-models:/root/.cache/huggingface
      - paddle-models:/root/.paddlex
    restart: unless-stopped

volumes:
  postgres-data:
  tiktok-browser-profile:
  douyin-browser-profile:
  whisper-models:
  whisper-hf-models:
  paddle-models:
